---
project_name: kube-ephemeral-container-exporter
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: kube-ephemeral-container-exporter
    main: ./cmd/main.go
    binary: kube-ephemeral-container-exporter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{ .Tag }}
      - -X main.Commit={{ .FullCommit }}

dockers_v2:
  - id: kube-ephemeral-container-exporter
    ids:
      - kube-ephemeral-container-exporter
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "Prometheus exporter for Kubernetes ephemeral containers."
      org.opencontainers.image.licenses: "GPL-3.0-only"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/containeroo/kube-ephemeral-container-exporter"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/containeroo/kube-ephemeral-container-exporter"
      org.opencontainers.image.version: "{{ .Tag }}"
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/containeroo/kube-ephemeral-container-exporter
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
